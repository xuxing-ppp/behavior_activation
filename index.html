<div class="shell">
<aside class="sidebar"><div class="logo"><img class="logo-mark" src="assets/icons/icon.svg" alt="" width="37" height="37" /> 微光</div><nav class="nav" aria-label="主导航" id="deskNav"></nav><div class="side-foot">慢慢来，也是一种前进。<br>你的记录只储存在此浏览器中。<br><span style="opacity:.7">行为激活 · 自助练习</span></div></aside>
<main id="content" class="main" tabindex="-1"><div class="topline"><div class="eyebrow">BEHAVIORAL ACTIVATION</div><div class="date-chip" id="dateChip"></div></div><div id="view"></div></main>
</div><nav class="tabs-mob" aria-label="手机导航" id="mobNav"></nav><div id="modalRoot"></div><div id="snack" class="snackbar" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden />
<script>
(()=>{'use strict';
const KEY='weiguang-ba-v1';const $=s=>document.querySelector(s);const categories={care:['🌿','照顾自己'],move:['🚶','身体活动'],connect:['💬','人际连接'],progress:['📖','学习与事务'],joy:['🎨','兴趣与愉悦']};
const defaults={activities:[],moods:{},version:1};let data=load(),page='today',selectedDate=localDate(),recommendationId=null,modalReturn=null,undoRecord=null;
const moodDrafts=new Map();
function localDate(dt=new Date()){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function dateFrom(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function dayAdd(s,n){let d=dateFrom(s);d.setDate(d.getDate()+n);return localDate(d)}
function dayDiff(a,b){return Math.round((dateFrom(a)-dateFrom(b))/86400000)}
function humanDate(s){const d=dateFrom(s);return (s===localDate()?'今天 · ':'')+(d.getMonth()+1)+'月'+d.getDate()+'日'}
function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return valid(x)?x:structuredClone(defaults)}catch{return structuredClone(defaults)}}
function valid(x){return x&&typeof x==='object'&&Array.isArray(x.activities)&&x.moods&&typeof x.moods==='object'&&!Array.isArray(x.moods)}
function save(candidate){try{localStorage.setItem(KEY,JSON.stringify(candidate));data=candidate;return true}catch{toast('尚未保存：本地存储失败，输入已保留，请重试或导出备份。');return false}}
function commit(change){const next=structuredClone(data);change(next);return save(next)}
function updateActivity(id,change){return commit(next=>{const a=next.activities.find(x=>x.id===id);if(a)change(a)})}
function draftMood(){if(!moodDrafts.has(selectedDate)){const saved=data.moods[selectedDate];moodDrafts.set(selectedDate,{mood:saved?.mood??null,note:saved?.note||''})}return moodDrafts.get(selectedDate)}
function rememberMood(){const input=$('#moodNote');if(input)draftMood().note=input.value}
function clearFeedback(a){delete a.pleasure;delete a.mastery;delete a.note;delete a.feedbackAt;delete a.skipReason}
function dateControls(){return `<div class="day-control"><button data-action="dayPrev" aria-label="前一天">‹</button><span class="date-label">${humanDate(selectedDate)}</span><button data-action="dayNext" aria-label="后一天">›</button>${selectedDate!==localDate()?'<button data-action="goToday">回到今天</button>':''}</div>`}
function feedbackSummary(a){return [a.pleasure!=null?'愉悦 '+a.pleasure+'/10':'',a.mastery!=null?'成就 '+a.mastery+'/10':''].filter(Boolean).join(' · ')}

function uid(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function toast(s){const n=$('#snack');n.textContent=s;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display='none',2700)}
const tabs=[['today','⌂','今天'],['plan','▦','安排'],['insights','◷','回顾'],['guide','♡','指南']];
function nav(){const html=tabs.map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="nav-icon">${icon}</span> ${label}</button>`).join('');$('#deskNav').innerHTML=html;$('#mobNav').innerHTML=tabs.map(([id,icon,label])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span>${icon}</span>${label}</button>`).join('')}
function dailyTasks(s){return data.activities.filter(x=>x.date===s).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||(a.created||0)-(b.created||0))}
function dateHeading(){const d=new Date();return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · ${'日一二三四五六'[d.getDay()]}`}
function progress(s){const a=dailyTasks(s),done=a.filter(x=>x.status==='done').length;return [done,a.length]}
function taskItem(a){const [icon,name]=categories[a.category]||categories.care;const st=a.status;const id=e(a.id);const primary=st==='done'?`<span class="tag done">✓ 已完成</span><button class="mini" data-action="feedback" data-id="${id}">${a.feedbackAt?'修改感受':'补充感受'}</button>`:st==='skipped'?`<span class="tag skip">↪ 暂缓</span>`:`${a.date===localDate()?`<button class="mini" data-action="start" data-id="${id}">开始</button>`:''}<button class="mini" data-action="complete" data-id="${id}">做到了</button>`;return `<div class="task ${st||''}" data-task-id="${id}"><div class="task-icon" aria-hidden="true">${icon}</div><div class="task-info"><h3>${e(a.title)}</h3><p>${a.time?e(a.time)+' · ':''}${e(a.minutes)} 分钟 · ${name}${a.step?' · 第一步：'+e(a.step):''}</p>${st==='done'&&feedbackSummary(a)?`<p>${feedbackSummary(a)}</p>`:''}${st==='skipped'&&a.skipReason?`<p>${e(a.skipReason)}</p>`:''}</div><div class="task-actions">${primary}<button class="mini" data-action="edit" data-id="${id}" aria-label="编辑 ${e(a.title)}">调整</button></div></div>`}

function taskList(s){const a=dailyTasks(s);return a.length?`<div class="stack">${a.map(taskItem).join('')}</div>`:`<div class="empty"><div class="flower">🌱</div>这一天还没有计划。<br><span class="small">从一件只需要 5 分钟的事开始就很好。</span></div>`}
function ratingButtons(selected,prefix){const labels={mood:'情绪',pleasure:'愉悦感',mastery:'成就感'};return `<div class="rating-row" role="group" aria-label="${labels[prefix]}评分">${Array.from({length:11},(_,n)=>`<button type="button" class="rating ${selected===n?'selected':''}" data-rate="${prefix}" data-score="${n}" aria-label="${labels[prefix]} ${n} 分" aria-pressed="${selected===n}">${n}</button>`).join('')}</div>`}

function moodCard(){const saved=data.moods[selectedDate],draft=moodDrafts.get(selectedDate);const m=draft?.mood??saved?.mood??null;return `<div class="card"><div class="card-head"><div><h2>给此刻留个记号</h2><p class="muted small">心情 0 很低落 · 10 很愉快</p></div><span class="tag">${saved?'已记录':'可选记录'}</span></div>${ratingButtons(m,'mood')}<div class="field"><label for="moodNote">这一刻有什么感受？（选填）</label><textarea id="moodNote" maxlength="1200" rows="2" placeholder="一两句话就好，也可以留空">${e(draft?.note??saved?.note??'')}</textarea></div><div class="mood-footer"><span class="small muted">可以先行动，想记录时再回来。</span><button class="btn btn-primary" data-action="saveMood">${saved?'更新心情':'保存心情'}</button></div><p class="status-note">未保存的草稿在本次页面切换中保留，刷新后不保留。</p></div>`}

function todayPage(){const tasks=dailyTasks(selectedDate),pending=tasks.filter(x=>!x.status),done=tasks.filter(x=>x.status==='done').length;const a=pending.find(x=>x.id===recommendationId)||pending[0];const isToday=selectedDate===localDate();return `<header class="daily-heading"><div><div class="eyebrow">ONE SMALL STEP</div><h1>${isToday?'从一小步开始。':humanDate(selectedDate)+'的记录'}</h1><p class="muted small">${isToday?'不用一次做好全部，先选现在能做的一点。':'这是'+(selectedDate<localDate()?'过去':'未来')+'的日期。记录和调整会保存在这一天。'}</p></div>${dateControls()}</header>${isToday?`<section class="hero next-step" aria-labelledby="nextTitle"><div class="eyebrow">${a?'现在可以试试':'给今天留一点空间'}</div><h2 id="nextTitle">${a?e(a.title):tasks.length?'今天也可以到这里。':'先选一件容易的小事。'}</h2>${a?`<div class="step-detail"><span class="tag">约 ${a.minutes} 分钟</span><span>${(categories[a.category]||categories.care)[1]}</span></div><p class="first-step"><span>只需先做</span>${e(a.step||a.title)}</p><div class="hero-actions"><button class="btn btn-primary" data-action="start" data-id="${e(a.id)}">开始这一步 →</button><button class="btn btn-white" data-action="shrink" data-id="${e(a.id)}">再缩小一点</button>${pending.length>1?'<button class="btn btn-text" data-action="nextSuggestion">换一件</button>':''}</div>`:`<p>${tasks.length?'已经做的值得被看见，暂缓的也可以以后调整。':'按自己的状态修改，不用做完所有建议。'}</p>${!tasks.length?`<div class="starter-options">${[['喝一杯水','care',2],['到窗边站一会儿','move',2],['听一首喜欢的歌','joy',4]].map(([title,cat,min])=>`<button class="starter" data-action="suggest" data-title="${title}" data-category="${cat}" data-min="${min}"><span>${categories[cat][0]}</span><strong>${title}</strong><small>${min} 分钟 · 可修改 →</small></button>`).join('')}</div>`:`<button class="btn btn-white" data-action="add">＋ 再安排一件小事</button>`}`}</section>`:''}<div class="cards"><div class="card"><div class="card-head"><div><h2>我的小步计划</h2><p class="small muted">${done?'已记录 '+done+' 次行动 · ':''}${pending.length?'还有 '+pending.length+' 件可以尝试':'不必填满一天'}</p></div><button data-action="add" class="btn btn-soft" aria-label="增加活动">＋ 添加</button></div>${taskList(selectedDate)}</div>${moodCard()}<div class="quiet-note card-wide"><span aria-hidden="true">🌱</span><p>今天没有做到，也可以调整。<br><span class="small muted">把步骤缩小、换个时间，或先好好休息。</span></p><button class="btn btn-text" data-page="guide">看看练习指南 →</button></div></div>`}

function planPage(){const start=dayAdd(selectedDate,-3),daynames='日一二三四五六';const days=Array.from({length:7},(_,i)=>dayAdd(start,i));const [done,total]=progress(selectedDate);return `<div class="section-intro"><div class="eyebrow">ACTIVITY SCHEDULING</div><h1>计划一点小行动</h1><p>从合理的小目标开始。建议一天先安排 1–3 件事，不必填满日程。</p></div><div class="card"><div class="card-head"><h2>选择日期</h2><div class="toolbar">${dateControls()}<button data-action="add" class="btn btn-primary">＋ 新活动</button></div></div><div class="week">${days.map(s=>{let [d,t]=progress(s);return `<button class="day ${s===selectedDate?'active':''}" data-action="chooseDay" data-date="${s}" aria-pressed="${s===selectedDate}"><small>周${daynames[dateFrom(s).getDay()]}</small><b>${dateFrom(s).getDate()}</b><div class="day-dot" style="opacity:${t?1:.14}"></div></button>`}).join('')}</div><div class="line"></div><div class="card-head"><div><h2>${humanDate(selectedDate)}的计划</h2><p class="small muted">完成 ${done}/${total}</p></div><div style="width:110px" class="progress"><div style="width:${total?100*done/total:0}%"></div></div></div>${taskList(selectedDate)}</div><div class="card" style="margin-top:20px"><div class="card-head"><div><h2>没有头绪？选一个开始</h2><p class="small muted">这些只是灵感，按你的状态调整。</p></div></div><div class="guide-grid">${[['🚶','下楼走一小段','move',5],['🫗','喝杯水，打开窗户','care',2],['📖','读一页书或论文','progress',5],['💬','给熟悉的人发一句问候','connect',3],['🎵','听一首喜欢的歌','joy',4]].map(([icon,title,cat,min])=>`<div class="suggestion"><div><strong>${icon} ${title}</strong><p>约 ${min} 分钟</p></div><button class="mini" data-action="suggest" data-title="${e(title)}" data-category="${cat}" data-min="${min}">＋ 添加</button></div>`).join('')}</div></div>`}
function moodChart(){const days=Array.from({length:14},(_,i)=>dayAdd(localDate(),i-13));const pts=days.map((s,i)=>data.moods[s]?.mood==null?null:{x:35+i*29.6,y:162-data.moods[s].mood*13.3,v:data.moods[s].mood,date:s});let circles=pts.filter(Boolean).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#478b73"><title>${p.date}：${p.v}/10</title></circle>`).join('');let paths='',segment=[];function flush(){if(segment.length)paths+=`<path d="${segment.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ')}" fill="none" stroke="#478b73" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>`;segment=[]}pts.forEach(p=>p?segment.push(p):flush());flush();if(!pts.some(Boolean))return `<div class="empty">还没有情绪数据。<br><span class="small">记录几天后，这里会出现趋势。</span></div>`;return `<svg viewBox="0 0 460 206" role="img" aria-label="最近十四天的情绪评分曲线，满分十分">${[0,5,10].map(v=>`<line x1="35" x2="426" y1="${162-v*13.3}" y2="${162-v*13.3}" stroke="#e9efeb" stroke-dasharray="4 4"/><text class="svg-label" x="11" y="${166-v*13.3}">${v}</text>`).join('')}${paths}${circles}${[0,3,6,9,13].map(i=>`<text class="svg-label" x="${35+i*29.6}" y="190" text-anchor="middle">${dateFrom(days[i]).getMonth()+1}/${dateFrom(days[i]).getDate()}</text>`).join('')}</svg>`}
function insightsPage(){const past7=Array.from({length:7},(_,i)=>dayAdd(localDate(),i-6));const acts=data.activities.filter(x=>past7.includes(x.date));const done=acts.filter(x=>x.status==='done');const tracked=past7.filter(s=>data.moods[s]?.mood!=null);const avg=tracked.length?(tracked.reduce((sum,s)=>sum+data.moods[s].mood,0)/tracked.length).toFixed(1):'—';const cd=Object.entries(categories).map(([id,[icon,name]])=>[icon,name,done.filter(x=>x.category===id).length]).sort((a,b)=>b[2]-a[2]);const reflections=[...done].filter(x=>x.note).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4);return `<div class="section-intro"><div class="eyebrow">REFLECTION & PROGRESS</div><h1>回顾，而不是评判</h1><p>观察什么能带来帮助。情绪偶尔波动并不代表进步消失。</p></div><div class="metric-row"><div class="metric"><span>近 7 天完成</span><strong>${done.length}</strong><span>次小小的行动</span></div><div class="metric"><span>近 7 天平均心情</span><strong>${avg}</strong><span>共记录 ${tracked.length} 天</span></div><div class="metric"><span>留下的行动反馈</span><strong>${done.filter(x=>x.pleasure!=null||x.mastery!=null||x.note).length}</strong><span>想写时再写就好</span></div></div>${repeatSuggestions(done)}<div class="cards"><div class="card card-wide"><div class="card-head"><div><h2>最近 14 天的情绪</h2><p class="muted small">没有记录的日期不会被自动补齐</p></div></div><div class="chartbox">${moodChart()}</div><div class="legend"><span><i></i>心情评分（0–10）</span><span>变化本来就不是直线</span></div></div><div class="card"><div class="card-head"><h2>行动的类型</h2></div>${cd.map(([icon,name,count])=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span>${icon} ${name}</span><strong>${count} 次</strong></div><div class="progress"><div style="width:${done.length?count/done.length*100:0}%"></div></div></div>`).join('')}<p class="status-note">有时，休息和社交比效率更值得优先安排。</p></div><div class="card"><div class="card-head"><h2>从行动中学到什么</h2></div>${reflections.length?reflections.map(x=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)"><div class="small muted">${e(x.date)} · ${e(x.title)}</div><div style="font-size:13px;margin-top:6px">${e(x.note)}</div></div>`).join(''):`<div class="empty">完成活动时可以留下短短一句感受。<br><span class="small">例如「没想象中困难」。</span></div>`}<div class="prompt">每周可以问自己：哪件事让我更接近重视的生活？哪些计划需要再缩小一点？</div></div></div>`}
function guidePage(){return `<div class="section-intro"><div class="eyebrow">YOUR GENTLE GUIDE</div><h1>行为激活练习指南</h1><p>重建与有意义的活动之间的联系，而不是逼迫自己「积极起来」。</p></div><div class="cards"><div class="card"><h2>最简单的使用方式</h2><ol class="steps" style="margin-top:20px"><li><strong>记录当下的心情</strong><p>用 0–10 分粗略标记即可，不需要找出原因。</p></li><li><strong>安排一项具体活动</strong><p>写明做什么、何时做、做多久，以及最小的第一步。</p></li><li><strong>行动后再观察</strong><p>记录愉悦感与成就感，允许两者都很低。</p></li><li><strong>每周温和回顾</strong><p>哪些活动有帮助？什么困难反复出现？据此调整。</p></li></ol></div><div class="card"><h2>如何区分休息与回避？</h2><p class="muted small" style="margin-top:10px">二者不是简单的好坏分类。可以试着问自己：</p><div class="prompt">「我正在有意识地补充精力，还是为了暂时不面对痛苦而不断推迟自己重视的事情？」</div><p class="small muted" style="margin-top:17px">真正的休息、游戏、娱乐、放空也可以是有价值的行为激活活动。</p><div class="line"></div><h3>如果今天没有做到</h3><p class="small muted" style="margin-top:7px">不必补偿，也不需要责备自己。把 30 分钟改成 5 分钟，或先准备好工具，就已经是有用的调整。</p></div><div class="card card-wide"><h2>应对「不想开始」的温和策略</h2><div class="guide-grid" style="margin-top:16px"><div class="guide-box"><h3>① 缩小步骤</h3><p>从「完成整章」变成「打开文件，看第一段」。</p><button data-action="quick" data-kind="two">试一个两分钟计划 →</button></div><div class="guide-box"><h3>② 提前规定情境</h3><p>「吃完午饭后，坐在桌前读 5 分钟」，通常比「找时间读书」更具体。</p><button data-action="add">写下具体计划 →</button></div><div class="guide-box"><h3>③ 让活动类别更均衡</h3><p>可以同时安排照顾自己、兴趣、连接他人和必要事务。</p><button data-page="plan">看看活动建议 →</button></div><div class="guide-box"><h3>④ 注意长期意义</h3><p>一次行动可能没有立刻改善情绪，它仍然可能有价值。不要只以当下开心程度评判。</p><button data-page="insights">回顾行动反馈 →</button></div></div><div class="guide-note">这是辅助自助练习的工具，不是诊断或正式心理治疗的替代品。如果情绪问题持续、明显影响生活，或出现伤害自己的念头，请联系心理健康专业人员；有即时危险时联系所在地紧急服务。</div></div><div class="card card-wide"><div class="card-head"><div><h2>数据与隐私</h2><p class="muted small">记录默认只保存在当前浏览器的本地存储中，不上传服务器。</p></div></div><div class="settings-row"><div><strong>导出记录</strong><p>将活动和心情保存为 JSON 文件，便于备份或转移设备。</p></div><button class="btn btn-outline" data-action="export">导出 JSON</button></div><div class="settings-row"><div><strong>导入记录</strong><p>从之前导出的文件恢复；会替换当前浏览器已有记录。</p></div><button class="btn btn-outline" data-action="import">导入 JSON</button></div><div class="settings-row"><div><strong>清除记录</strong><p>仅清除此浏览器中保存的数据，此操作无法撤销。</p></div><button class="btn btn-outline" data-action="clear">清除全部</button></div><p class="status-note">注意：浏览器无痕模式或清除网站数据可能丢失记录。使用他人的设备时不建议输入私人内容。</p></div></div>`}
function repeatSuggestions(done){const rated=done.filter(a=>a.pleasure!=null||a.mastery!=null).sort((a,b)=>Math.max(b.pleasure??-1,b.mastery??-1)-Math.max(a.pleasure??-1,a.mastery??-1)).slice(0,3);return `<section class="card repeat-card"><div class="card-head"><div><h2>下次还想试试吗？</h2><p class="small muted">近 7 天中，评分相对较高的几次行动。只是你的记录，不代表因果。</p></div></div>${rated.length?rated.map(a=>`<div class="suggestion"><div><strong>${e(a.title)}</strong><p>${feedbackSummary(a)} · ${e(a.date)}</p></div><button class="mini" data-action="repeat" data-id="${e(a.id)}">再次安排</button></div>`).join(''):'<p class="muted small">有空时给完成的活动补充一点感受，之后可以在这里挑选想再做的事。</p>'}</section>`}
function render(){nav();$('#dateChip').textContent=dateHeading();$('#view').innerHTML=({today:todayPage,plan:planPage,insights:insightsPage,guide:guidePage}[page])()}

function openModal(content){$('#snack').style.display='none';if(!$('#modalLayer'))modalReturn=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-layer" id="modalLayer"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1">${content}</div></div>`;$('#modalRoot h2').id='dialogTitle';$('.shell').inert=true;$('#mobNav').inert=true;document.body.style.overflow='hidden';$('#modalRoot .close')?.focus()}
function restoreFocus(){if(modalReturn?.isConnected)modalReturn.focus();else $('#content').focus();modalReturn=null}

function closeModal(){if(!$('#modalLayer'))return;$('#modalRoot').innerHTML='';$('.shell').inert=false;$('#mobNav').inert=false;document.body.style.overflow='';restoreFocus()}
function finishMutation(message){closeModal();render();$('#content').focus({preventScroll:true});toast(message)}
function startModal(id){const a=data.activities.find(x=>x.id===id);if(!a||a.status||a.date!==localDate())return;openModal(`<div class="modal-title"><h2>现在，只做这一件</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><div class="focus-step"><span class="tag">约 ${e(a.minutes)} 分钟 · 按自己的节奏</span><h3>${e(a.title)}</h3><p class="muted small">最小的第一步</p><p class="focus-first">${e(a.step||a.title)}</p>${a.why?`<p class="small muted">对我的意义：${e(a.why)}</p>`:''}</div><p class="small muted">从这一步开始就好，随时可以停下来调整。</p><div class="foot-actions"><button class="btn btn-outline" data-action="skip" data-id="${e(id)}">先放一放</button><button class="btn btn-soft" data-action="shrink" data-id="${e(id)}">调整一下</button><button class="btn btn-primary" data-action="complete" data-id="${e(id)}">做到了 ✓</button></div>`)}
function shrinkModal(id){const a=data.activities.find(x=>x.id===id);if(!a)return;openModal(`<div class="modal-title"><h2>小到愿意开始就好</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><p class="small muted">${e(a.title)} · 只调整这条计划，不会多加一件。</p><form id="shrinkForm"><input type="hidden" name="id" value="${e(id)}"><div class="field"><label for="smallStep">只做哪一小步？</label><input id="smallStep" name="step" maxlength="130" required value="${e(a.step||'')}" placeholder="如：拿出书，翻开一页"></div><div class="field"><label for="smallMinutes">给它几分钟？</label><div class="toolbar">${[2,5,10].map(n=>`<button type="button" class="pill" data-action="duration" data-min="${n}" aria-pressed="${a.minutes===n}">${n} 分钟</button>`).join('')}</div><input id="smallMinutes" name="minutes" type="number" min="1" max="1440" required value="${Math.min(a.minutes,5)}"></div><div class="foot-actions"><button type="button" class="btn btn-outline" data-action="close">取消</button><button class="btn btn-primary" type="submit">保存这一小步</button></div></form>`);syncDuration();$('#smallStep').focus()}
function completeActivity(id){const a=data.activities.find(x=>x.id===id);if(!a||a.status==='done')return;const before=structuredClone(a);if(!updateActivity(id,a=>{clearFeedback(a);a.status='done'}))return;undoRecord={id,before};finishMutation('完成已记录。这一步很珍贵。');const n=$('#snack');clearTimeout(toast.t);const actions=document.createElement('span');actions.className='snack-actions';for(const [action,label] of [['undo','撤销'],['feedback','补充感受']]){const b=document.createElement('button');b.type='button';b.dataset.action=action;b.dataset.id=id;b.textContent=label;actions.appendChild(b)}n.appendChild(actions);toast.t=setTimeout(()=>n.style.display='none',15000)}

function activityModal(id=null,proposal=null){const a=data.activities.find(a=>a.id===id)||proposal||{};const isEdit=!!id;openModal(`<div class="modal-title"><h2>${isEdit?'调整这个计划':'安排一件小事'}</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><p class="small muted">从你现在能做到的版本开始。把困难的事拆小一点。</p><form id="activityForm"><input type="hidden" name="id" value="${e(id||'')}"><div class="field"><label for="actTitle">我准备做什么？ *</label><input id="actTitle" name="title" maxlength="90" required placeholder="如：打开论文，读 1 页" value="${e(a.title||'')}"></div><div class="split"><div class="field"><label for="actDate">哪一天</label><input type="date" id="actDate" name="date" required value="${e(a.date||selectedDate)}"></div><div class="field"><label for="actTime">大概几点（选填）</label><input type="time" id="actTime" name="time" value="${e(a.time||'')}"></div></div><div class="split"><div class="field"><label for="actDuration">大约几分钟</label><input id="actDuration" type="number" name="minutes" min="1" max="1440" required value="${e(a.minutes||5)}"></div><div class="field"><label for="actCategory">活动类别</label><select id="actCategory" name="category">${Object.entries(categories).map(([k,[icon,name]])=>`<option value="${k}" ${a.category===k?'selected':''}>${icon} ${name}</option>`).join('')}</select></div></div><div class="field"><label for="actStep">最小的第一步（可选）</label><input id="actStep" maxlength="130" name="step" placeholder="如：只打开 PDF 文件" value="${e(a.step||'')}"></div><div class="field"><label for="actWhy">它对我有什么意义？（可选）</label><input id="actWhy" maxlength="150" name="why" placeholder="如：我希望继续保持对学习的好奇" value="${e(a.why||'')}"></div><div class="foot-actions">${isEdit?'<button type="button" class="btn btn-outline" data-action="delete" data-id="'+e(id)+'" style="margin-right:auto;color:#ac6058">删除</button>':''}<button type="button" data-action="close" class="btn btn-outline">取消</button><button type="submit" class="btn btn-primary">${isEdit?'保存修改':'加入计划'}</button></div></form>${isEdit?`<div class="line"></div><div class="toolbar">${a.status==='done'?`<button class="btn btn-soft" data-action="feedback" data-id="${e(id)}">补充感受</button>`:`<button class="btn btn-soft" data-action="complete" data-id="${e(id)}">做到了</button>`}<button class="btn btn-soft" data-action="skip" data-id="${e(id)}">今天先不做</button>${a.status?`<button class="btn btn-text" data-action="reset" data-id="${e(id)}">恢复为待完成</button>`:''}</div>`:''}`);$('#actTitle').focus()}
function completionModal(id){const a=data.activities.find(x=>x.id===id);if(!a||a.status!=='done')return;openModal(`<div class="modal-title"><h2>留一点行动后的感受</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><p><strong>${e(a.title)}</strong></p><p class="muted small">已经记录完成，下面都可以不填。</p><form id="completeForm"><input name="id" value="${e(id)}" type="hidden">${[['pleasure','愉悦感','0 没有愉悦 · 10 非常愉悦'],['mastery','成就感／掌控感','0 没有成就感 · 10 很有成就感']].map(([key,label,hint])=>`<div class="field"><label>${label}（选填）</label><p class="tiny muted">${hint}</p><input type="hidden" name="${key}" value="${a[key]??''}">${ratingButtons(a[key]??null,key)}<button type="button" class="btn btn-text clear-rating" data-action="clearRating" data-kind="${key}">清除这项评分</button></div>`).join('')}<div class="field"><label for="finishNote">这次有什么发现？（选填）</label><textarea name="note" id="finishNote" maxlength="700" placeholder="例如：刚开始有点难，做了一点之后没那么抗拒">${e(a.note||'')}</textarea></div><div class="foot-actions"><button type="button" class="btn btn-outline" data-action="close">先不写</button><button type="submit" class="btn btn-primary">保存感受</button></div></form>`)}

function skipModal(id){const a=data.activities.find(x=>x.id===id);if(!a)return;openModal(`<div class="modal-title"><h2>给计划留一点余地</h2><button class="close" data-action="close" aria-label="关闭">×</button></div><p><strong>${e(a.title)}</strong></p><p class="small muted">可以先放下，也可以换个时间、再缩小一点。</p><form id="skipForm"><input name="id" type="hidden" value="${e(id)}"><div class="field"><label for="skipReason">遇到了什么？（选填）</label><select name="reason" id="skipReason">${['','任务太大，难以开始','精力不足，需要休息','时间或环境不合适','临时有更重要的事情','其他原因'].map(x=>`<option value="${x}" ${a.skipReason===x?'selected':''}>${x||'不记录原因'}</option>`).join('')}</select></div><div class="foot-actions"><button type="button" class="btn btn-outline" data-action="shrink" data-id="${e(id)}">再调整一下</button><button class="btn btn-soft" type="submit" name="decision" value="tomorrow">改到明天</button><button class="btn btn-primary" type="submit" name="decision" value="skip">先暂缓</button></div></form>`)}

function copyDefaults(kind){return kind==='two'?{title:'尝试两分钟的小行动',minutes:2,category:'care',step:'选择现在最容易开始的一件事'}:null}
function setPage(p){rememberMood();page=p;render();$('#content').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}
function changeDate(date){rememberMood();selectedDate=date;recommendationId=null;render()}

function handleClick(ev){const btn=ev.target.closest('button[data-page],button[data-action],button[data-rate]');if(!btn)return;rememberMood();if(btn.dataset.page){setPage(btn.dataset.page);return}if(btn.dataset.rate){const score=Number(btn.dataset.score),key=btn.dataset.rate;if(key==='mood')draftMood().mood=score;else $(`#completeForm [name="${key}"]`).value=score;document.querySelectorAll(`[data-rate="${key}"]`).forEach(el=>{el.classList.toggle('selected',Number(el.dataset.score)===score);el.setAttribute('aria-pressed',Number(el.dataset.score)===score)});return}const id=btn.dataset.id;switch(btn.dataset.action){
case'add':activityModal();break;case'edit':activityModal(id);break;
case'start':startModal(id);break;case'shrink':shrinkModal(id);break;
case'complete':completeActivity(id);break;case'feedback':completionModal(id);break;
case'undo':if(undoRecord?.id===id){const before=undoRecord.before;if(!updateActivity(id,a=>{Object.keys(a).forEach(k=>delete a[k]);Object.assign(a,before)}))return;undoRecord=null;finishMutation('已撤销完成记录')}break;
case'clearRating':{const key=btn.dataset.kind;$(`#completeForm [name="${key}"]`).value='';document.querySelectorAll(`[data-rate="${key}"]`).forEach(el=>{el.classList.remove('selected');el.setAttribute('aria-pressed','false')});break}
case'duration':$('#smallMinutes').value=btn.dataset.min;syncDuration();break;
case'nextSuggestion':{rememberMood();const pending=dailyTasks(localDate()).filter(a=>!a.status);const i=pending.findIndex(a=>a.id===recommendationId);recommendationId=pending[((i<0?0:i)+1)%pending.length]?.id;render();$('.next-step [data-action="start"]')?.focus();break}
case'repeat':{const a=data.activities.find(x=>x.id===id);if(a)activityModal(null,{title:a.title,category:a.category,minutes:a.minutes,step:a.step,why:a.why,date:localDate()});break}
case'skip':skipModal(id);break;case'close':closeModal();break;
case'dayPrev':changeDate(dayAdd(selectedDate,-1));break;case'dayNext':changeDate(dayAdd(selectedDate,1));break;case'goToday':changeDate(localDate());break;case'chooseDay':changeDate(btn.dataset.date);break;
case'saveMood':{rememberMood();const draft=draftMood();if(draft.mood==null){toast('先选择一个 0–10 的心情分数');return}if(!commit(next=>next.moods[selectedDate]={mood:draft.mood,note:draft.note.trim().slice(0,1200),updated:Date.now()}))return;moodDrafts.delete(selectedDate);render();toast('心情已记录。谢谢你照顾自己。');break}
case'quick':activityModal(null,copyDefaults(btn.dataset.kind));break;case'suggest':activityModal(null,{title:btn.dataset.title,category:btn.dataset.category,minutes:Number(btn.dataset.min)});break;
case'delete':if(confirm('确认删除这条活动及其反馈记录吗？')){if(!commit(next=>next.activities=next.activities.filter(a=>a.id!==id)))return;undoRecord=null;finishMutation('活动已删除')}break;
case'reset':if(!updateActivity(id,a=>{a.status='';clearFeedback(a)}))return;undoRecord=null;finishMutation('已恢复为待尝试');break;
case'export':exportData();break;case'import':$('#importFile').click();break;
case'clear':if(confirm('确定清除所有活动和心情记录吗？此操作不可撤销。')&&confirm('再次确认：真的要永久清空这个浏览器中的所有记录吗？')){if(!save(structuredClone(defaults)))return;moodDrafts.clear();undoRecord=null;render();toast('已清除全部本地记录')}break;
}}
function syncDuration(){document.querySelectorAll('[data-action="duration"]').forEach(b=>{const on=Number(b.dataset.min)===Number($('#smallMinutes').value);b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)})}

function submit(ev){const formType=ev.target.getAttribute('id');if(!['activityForm','completeForm','skipForm','shrinkForm'].includes(formType))return;ev.preventDefault();const f=new FormData(ev.target),id=String(f.get('id')||'');rememberMood();
if(formType==='activityForm'){const title=String(f.get('title')||'').trim(),date=String(f.get('date')||''),minutes=Number(f.get('minutes'));if(!title||!isDate(date)||!Number.isInteger(minutes)||minutes<1||minutes>1440){toast('请检查活动名称、日期和分钟数');return}const old=data.activities.find(a=>a.id===id);const a={...old,id:id||uid(),title:title.slice(0,90),date,time:String(f.get('time')||''),minutes,category:Object.hasOwn(categories,f.get('category'))?f.get('category'):'care',step:String(f.get('step')||'').trim().slice(0,130),why:String(f.get('why')||'').trim().slice(0,150),status:old?.status||'',created:old?.created||Date.now()};if(!commit(next=>{const index=next.activities.findIndex(x=>x.id===id);if(index>=0)next.activities[index]=a;else next.activities.push(a)}))return;selectedDate=date;finishMutation(id?'计划已更新':'小计划已加入');return}
const a=data.activities.find(x=>x.id===id);if(!a)return;
if(formType==='shrinkForm'){const step=String(f.get('step')||'').trim(),minutes=Number(f.get('minutes'));if(!step||!Number.isInteger(minutes)||minutes<1||minutes>1440){toast('请填写一小步和有效分钟数');return}if(!updateActivity(id,a=>{a.step=step.slice(0,130);a.minutes=minutes;if(a.status==='skipped'){a.status='';delete a.skipReason}}))return;finishMutation('已缩小计划，按这个版本试试就好');return}
if(formType==='completeForm'){if(!updateActivity(id,a=>{for(const key of ['pleasure','mastery']){const value=f.get(key);if(value==='')delete a[key];else if(Number.isInteger(Number(value))&&Number(value)>=0&&Number(value)<=10)a[key]=Number(value)}a.note=String(f.get('note')||'').trim().slice(0,700);a.feedbackAt=Date.now()}))return;undoRecord=null;finishMutation('感受已保存');return}
const tomorrow=ev.submitter?.value==='tomorrow';if(!updateActivity(id,a=>{clearFeedback(a);if(tomorrow){a.date=dayAdd(localDate(),1);a.status='';a.time=''}else{a.status='skipped';a.skipReason=String(f.get('reason')||'')}}))return;undoRecord=null;finishMutation(tomorrow?'已改到明天，没有增加重复计划':'已暂缓。需要时再调整就好')}
function isDate(value){return typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&localDate(dateFrom(value))===value}

function exportData(){const payload={app:'微光-行为激活',exportedAt:new Date().toISOString(),version:1,activities:data.activities,moods:data.moods};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='微光-行为激活-'+localDate()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500);toast('备份文件已导出')}
$('#importFile').addEventListener('change',async ev=>{const file=ev.target.files?.[0];ev.target.value='';if(!file)return;if(file.size>5_000_000){toast('文件过大，已拒绝导入');return}try{const obj=JSON.parse(await file.text());if(!valid(obj)||obj.activities.length>30000){toast('文件格式不符合本应用的备份格式');return}const clean={activities:[],moods:{},version:1};for(const x of obj.activities){if(!x||typeof x.title!=='string'||typeof x.date!=='string'||typeof x.id!=='string'||!isDate(x.date))continue;clean.activities.push({id:x.id.slice(0,100),title:x.title.slice(0,90),date:x.date,time:typeof x.time==='string'?x.time.slice(0,5):'',minutes:Math.max(1,Math.min(1440,Math.round(Number(x.minutes)||5))),category:Object.hasOwn(categories,x.category)?x.category:'care',step:typeof x.step==='string'?x.step.slice(0,130):'',why:typeof x.why==='string'?x.why.slice(0,150):'',status:['','done','skipped'].includes(x.status)?x.status:'',created:Number(x.created)||Date.now(),feedbackAt:Number.isFinite(x.feedbackAt)?x.feedbackAt:undefined,pleasure:Number.isInteger(x.pleasure)?Math.max(0,Math.min(10,x.pleasure)):undefined,mastery:Number.isInteger(x.mastery)?Math.max(0,Math.min(10,x.mastery)):undefined,note:typeof x.note==='string'?x.note.slice(0,700):'',skipReason:typeof x.skipReason==='string'?x.skipReason.slice(0,150):''})}for(const [s,v] of Object.entries(obj.moods)){if(isDate(s)&&v&&Number.isInteger(v.mood)&&v.mood>=0&&v.mood<=10)clean.moods[s]={mood:v.mood,note:typeof v.note==='string'?v.note.slice(0,1200):'',updated:Number(v.updated)||Date.now()}}if(!confirm(`将导入 ${clean.activities.length} 条活动记录，并覆盖当前所有本地记录，确定吗？`))return;if(!save(clean))return;moodDrafts.clear();undoRecord=null;render();toast('记录已导入')}catch{toast('无法读取文件，请确认它是有效的 JSON 备份')}});
document.addEventListener('click',handleClick);
document.addEventListener('submit',submit);
document.addEventListener('input',ev=>{if(ev.target.id==='moodNote')rememberMood();if(ev.target.id==='smallMinutes')syncDuration()});
document.addEventListener('keydown',ev=>{const modal=$('#modalLayer .modal');if(!modal)return;if(ev.key==='Escape'){ev.preventDefault();closeModal();return}if(ev.key==='Tab'){const items=[...modal.querySelectorAll('button:not([disabled]),input:not([type="hidden"]):not([disabled]),select,textarea,[tabindex="0"]')].filter(x=>x.getClientRects().length);const first=items[0],last=items[items.length-1];if(ev.shiftKey&&(document.activeElement===first||document.activeElement===modal)){ev.preventDefault();last?.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus()}}});
document.addEventListener('click',ev=>{if(ev.target?.id==='modalLayer')closeModal()});render();
})();
</script>
</body></html>
